[tool.ruff]
line-length = 100
target-version = "py310"
# The two import roots run.sh puts on PYTHONPATH, so isort sees core/controller
# as first-party.
src = ["workspace/src", "workspace/src/agx_reference"]

# Verbatim copies of kehuanjack/agilex-arm-gravity-compensation @ imp, kept
# byte-identical to the version that was validated on this arm. Reformatting
# them would destroy the only thing they are for, so this is an exclusion of
# third-party code rather than a suppression in ours.
extend-exclude = ["workspace/src/agx_reference"]

[tool.ruff.lint]
select = [
  "E", "F",      # pycodestyle, pyflakes
  "I",           # import sorting
  "UP",          # pyupgrade
  "B",           # bugbear: mutable defaults, loop-variable capture
  "SIM",         # nested conditionals, redundant branches
  "C90",         # mccabe cyclomatic complexity
  "PL",          # pylint: too many branches/statements/args
  "ARG",         # unused arguments (leftovers from abandoned approaches)
  "NPY",         # numpy-specific rules
  "RUF",
]
ignore = [
  "E501",        # line length is the formatter's job
  "PLR2004",     # magic numbers: too noisy in numerical code
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 8
max-statements = 30
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# Optional but recommended for numerical code — see /numeric-check.
# dev dependency: hypothesis
[tool.pyright]
include = ["workspace/src"]
extraPaths = ["workspace/src/agx_reference"]
typeCheckingMode = "standard"   # "strict" once the codebase settles
